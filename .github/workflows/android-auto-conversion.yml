name: Android Auto conversion
on:
  push:
    branches:
      - feature/android-auto-conversion
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Migrate all first-party Kotlin packages and source paths
        run: python3 .github/scripts/migrate-package.py
      - name: Commit migration on feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Migrate Kotlin sources to com.taxidriver.launcher"
            git push origin HEAD:feature/android-auto-conversion
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle verified Vietnam OSM SQLite into debug APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://github.com/ThanhTaxiXanh/TaxiDriverLauncher/releases/download/vietnam-osm-data/vietnam_road_data.db.gz" \
            --output app/src/main/assets/vietnam_road_data.osmcache
          python3 - <<'PY'
          import gzip
          import shutil
          import sqlite3
          from pathlib import Path

          compressed = Path("app/src/main/assets/vietnam_road_data.osmcache")
          path = Path("/tmp/vietnam_road_data_verified.db")
          with gzip.open(compressed, "rb") as source, path.open("wb") as target:
              shutil.copyfileobj(source, target)
          assert path.stat().st_size < 300 * 1024 * 1024
          con = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert con.execute("SELECT value FROM meta WHERE key='schema'").fetchone()[0] == "1"
          count_signs = con.execute("SELECT count(*) FROM signs").fetchone()[0]
          count_ways = con.execute("SELECT count(*) FROM speed_segments").fetchone()[0]
          assert count_signs > 0 and count_ways > 0, "Empty OSM dataset"
          print(f"Bundled Vietnam OSM: {count_signs} mapped signs, {count_ways} speed segments")
          con.close()
          PY
      - name: Build Android Auto debug APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          test -n "$MAPBOX_ACCESS_TOKEN" || { echo "::error::Missing MAPBOX_ACCESS_TOKEN"; exit 1; }
          test -n "$MAPBOX_DOWNLOADS_TOKEN" || { echo "::error::Missing MAPBOX_DOWNLOADS_TOKEN"; exit 1; }
          ./gradlew :app:testStableDebugUnitTest :app:assembleStableDebug --stacktrace
      - name: Verify APK contains offline OSM database
        run: |
          python3 - <<'PY'
          import glob
          import zipfile
          path = glob.glob("app/build/outputs/apk/stable/debug/*.apk")
          assert len(path) == 1, path
          with zipfile.ZipFile(path[0]) as apk:
              names = apk.namelist()
              candidates = [name for name in names if "vietnam_road_data" in name]
              print("Matching APK entries:", candidates)
              print("Sample assets:", [name for name in names if name.startswith("assets/")][:18])
              assert "assets/vietnam_road_data.osmcache" in names, "OSM SQLite was omitted from the APK"
              assert apk.getinfo("assets/vietnam_road_data.osmcache").file_size > 500000, "Empty OSM asset"
              print("Verified bundled Vietnam OSM asset in APK")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: taxi-driver-android-auto-debug
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
